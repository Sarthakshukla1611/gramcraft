version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: gramcraft-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gramcraft
    volumes:
      - mongo-data:/data/db
    networks:
      - gramcraft-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: gramcraft-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - CORS_ORIGIN=http://localhost:5000,http://localhost:5173
    networks:
      - gramcraft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: gramcraft-api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/gramcraft
      - ML_SERVICE_URL=http://ml-service:5001
      - JWT_SECRET=gramcraft_super_secret_jwt_key_2026_securerandom
      - JWT_REFRESH_SECRET=gramcraft_refresh_token_super_secret_key_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - gramcraft-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gramcraft-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - api-gateway
    networks:
      - gramcraft-network

networks:
  gramcraft-network:
    driver: bridge

volumes:
  mongo-data:
